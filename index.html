<style>
:root{
  --bg:#1b1b1b; --panel:#222222; --panel-2:#2a2a2a; --panel-3:#323232;
  --line:#383838; --line-2:#474747;
  --ink:#f5f3ef; --ink-2:#b5b0a8; --ink-3:#86817a; --chrome:#d9d9d9;
  --red:#d3263a; --blue:#3b63d6; --ok:#4bb487; --warn:#e2a93b;
  --display:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-lg:18px; --r-md:12px;
  --pole:repeating-linear-gradient(135deg,var(--red) 0 10px,#f5f3ef 10px 20px,var(--blue) 20px 30px,#f5f3ef 30px 40px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--chrome);outline-offset:2px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-md);padding:10px 16px;font-weight:700;font-size:14px;border:1px solid transparent;background:transparent;text-decoration:none;transition:background .15s}
.btn:active{transform:translateY(1px)}
.btn-main{background:var(--ink);color:#1b1b1b}.btn-main:hover{background:#fff}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#e3374b}
.btn-line{border-color:var(--line-2);color:var(--ink)}.btn-line:hover{background:var(--panel-2)}
.btn-wa{background:#1f8f55;color:#fff}.btn-wa:hover{background:#25a865}
.btn-ghost{color:var(--ink-2);padding:8px 10px}.btn-ghost:hover{color:var(--ink);background:var(--panel-2)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.input,select.input,textarea.input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;outline:0;color-scheme:dark}
.input:focus{border-color:var(--chrome)}
.fl{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 0 6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);cursor:pointer}
.check input{margin-top:3px;flex:none}
.muted{color:var(--ink-3)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt{margin-top:12px}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%}
.warn{background:rgba(226,169,59,.14);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px}

/* ---------- Página pública (estilo menú público RAVE) ---------- */
#pub{background:var(--bg);min-height:100vh;padding-bottom:90px}
.demo{background:var(--pole);background-size:57px 57px;color:#111;font-size:12px;font-weight:800;text-align:center;padding:0}
.demo span{display:block;background:rgba(245,243,239,.93);margin:5px 0;padding:3px 10px;letter-spacing:.3px}
.pub-top{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px max(16px,calc((100% - 1080px)/2));background:rgba(27,27,27,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.pub-brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.pub-brand i{width:40px;height:40px;border-radius:9px;background:var(--panel-3);display:grid;place-items:center;font-style:normal;font-size:22px;border:1px solid var(--line-2)}
.pub-brand span{font-family:var(--display);font-size:28px;letter-spacing:1px}
.pub-top nav{display:flex;gap:18px}
.pub-top nav a{text-decoration:none;color:var(--ink-2);font-weight:600;font-size:14px;white-space:nowrap}
.pub-top nav a:hover{color:var(--ink)}
.pub-hero{max-width:1080px;margin:0 auto;padding:48px 16px 40px;display:grid;grid-template-columns:minmax(220px,380px) 1fr;gap:44px;align-items:center}
.pub-logo{aspect-ratio:1;border-radius:24px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden;text-align:center}
.pub-logo::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:var(--pole);background-size:57px 57px}
.pub-logo .em{font-size:96px;line-height:1}
.pub-logo b{font-family:var(--display);font-weight:400;font-size:44px;letter-spacing:1.5px;line-height:1}
.pub-logo small{color:var(--ink-3);letter-spacing:3px;font-weight:700;font-size:12px}
.pub-hero h1{font-family:var(--display);font-weight:400;font-size:clamp(56px,8vw,104px);line-height:.92;margin:6px 0 14px;letter-spacing:.5px}
.pub-hero p{color:var(--ink-2);font-size:17px;max-width:46ch;margin:0}
.pub-hero p.pub-open{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.pub-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.pub-cta .btn{padding:13px 20px}
.pole-strip{height:8px;background:var(--pole);background-size:57px 57px}
.pub-sec{max-width:1080px;margin:0 auto;padding:46px 16px 10px;scroll-margin-top:100px}
.pub-sec h2{font-family:var(--display);font-weight:400;font-size:48px;margin:0;line-height:1}
.pub-lead{color:var(--ink-2);margin:8px 0 22px;max-width:62ch}
.pub-svc{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.svc-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.svc-row>div{flex:1;min-width:0}
.svc-row b{display:block;font-size:16px}
.svc-row small{color:var(--ink-3);font-size:13px}
.svc-row .tg{display:inline-block;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
.svc-p{font-family:var(--display);font-size:26px;white-space:nowrap}
.svc-row.on b{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line-2);background:transparent;padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink-2)}
.chip.on{background:var(--ink);color:#1b1b1b;border-color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.pimg{aspect-ratio:1.15;border-radius:12px;background:var(--panel-3);display:grid;place-items:center;font-size:52px;position:relative}
.pimg i{position:absolute;top:8px;left:8px;font-style:normal;font-size:10.5px;font-weight:800;background:var(--red);color:#fff;padding:2px 8px;border-radius:99px}
.pcard .pn{font-weight:700;line-height:1.25}
.pcard .pd{font-size:12.5px;color:var(--ink-3);flex:1;line-height:1.4}
.pcard .pp{font-family:var(--display);font-size:26px;line-height:1}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--panel-2);font-size:18px;font-weight:700}
.stepper span{min-width:18px;text-align:center;font-weight:800}
.pub-team{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tm{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.tm>div{flex:1}
.tm .btn{width:100%}
.tm b{display:block}
.tm small{display:block;color:var(--ink-3);font-size:12.5px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:26px;color:#fff;flex:none}
.pub-club{display:grid;grid-template-columns:1fr 380px;gap:36px;align-items:start}
.club-forms{display:grid;gap:22px}
.club-forms .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.club-card{position:sticky;top:110px}
.plans{display:grid;gap:10px}
.plan{text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:14px}
.plan.on{border-color:var(--chrome);background:var(--panel-3)}
.plan .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plan .pn2{font-family:var(--display);font-size:26px;line-height:1}
.plan .pr{font-family:var(--display);font-size:26px}
.plan .pr small{font-family:var(--body);color:var(--ink-3);font-size:12px}
.plan ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:13.5px;line-height:1.6}
.mcard{position:relative;aspect-ratio:1.586;border-radius:18px;padding:18px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 20px 50px rgba(0,0,0,.55);color:#fff}
.mcard::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--pole);background-size:57px 57px}
.mcard::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);pointer-events:none}
.mcard[data-plan=m1]{background:linear-gradient(135deg,#5a331b,#c98a54)}
.mcard[data-plan=m2]{background:linear-gradient(135deg,#323946,#a9b3c1)}
.mcard[data-plan=m3]{background:linear-gradient(135deg,#6e4f0e,#f2cf68);color:#1a1304}
.mcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-top:6px}
.mcard .brand{font-family:var(--display);font-size:26px;line-height:1;letter-spacing:.5px}
.mcard .brand small{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;opacity:.85;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.mcard .badge{font-size:11px;font-weight:800;border:1px solid currentColor;border-radius:99px;padding:3px 10px;white-space:nowrap}
.mcard .nm{font-family:var(--display);font-size:30px;letter-spacing:1px;text-transform:uppercase;word-break:break-word;line-height:1}
.mcard .meta{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:10.5px;letter-spacing:.5px}
.mcard .meta b{display:block;font-size:14px;letter-spacing:1px}
#mcQr{background:#fff;padding:4px;border-radius:6px;width:62px;height:62px;flex:none;line-height:0}
#mcQr img,#mcQr canvas{width:54px!important;height:54px!important}
.hint{color:var(--ink-3);font-size:12.5px;text-align:center;margin:10px 0 0}
.stamp{max-width:420px;margin:0 auto;background:#f5f3ef;color:#1b1b1b;border-radius:18px;padding:16px;position:relative;overflow:hidden;width:100%}
.stamp::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--pole);background-size:57px 57px}
.stamp-h{margin:6px 0 14px}
.stamp-h b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1;display:block}
.stamp-h small{color:#6d675f;font-size:12.5px}
.stamp .cnt{font-family:var(--display);font-size:30px;line-height:1}
.stamp-g{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.st{aspect-ratio:1;border-radius:50%;border:2px dashed #b9b3aa;display:grid;place-items:center;font-size:22px;color:#b9b3aa;font-weight:800}
.st.on{border:2px solid #1b1b1b;background:#1b1b1b;color:#fff}
.stamp-f{font-size:13px;color:#4a4640;margin-top:12px;font-weight:600}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.bank{background:var(--panel-2);border:1px dashed var(--line-2);border-radius:14px;padding:14px;margin-top:10px}
.bank .bh{font-weight:800;margin-bottom:8px}
.bank .br{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.bank .br span{color:var(--ink-3);width:68px;flex:none}
.bank .br b{flex:1;word-break:break-all}
.bank .amt{font-family:var(--display);font-size:24px;font-weight:400}
.bank .cp{border:1px solid var(--line-2);background:transparent;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700}
.bank p{margin:10px 0 0;color:var(--ink-3);font-size:12.5px;line-height:1.5}
.rsum{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.rsum .big{font-family:var(--display);font-size:72px;line-height:.9}
.stars{color:#f5b301;letter-spacing:2px}
.revs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.rev{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.rev .rh{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.rev p{margin:8px 0 0;color:var(--ink-2);font-size:14.5px}
.pub-branch{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;flex-direction:column}
.pub-branch h3{font-family:var(--display);font-weight:400;font-size:32px;margin:0;line-height:1}
.pub-branch p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.map{width:100%;min-height:300px;height:100%;border:0;border-radius:14px;filter:grayscale(.3) invert(.9) hue-rotate(180deg) contrast(.9)}
.hours div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.hours div:last-child{border:0}
.soc{display:flex;gap:8px;flex-wrap:wrap}
.soc a{text-decoration:none;font-size:13px;font-weight:700;padding:7px 14px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink)}
.soc a:hover{background:var(--panel-2)}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px}
details summary{font-weight:700;cursor:pointer}
details p{margin:8px 0 0;color:var(--ink-2)}
#qr{background:#fff;padding:12px;border-radius:12px;width:max-content;margin:12px 0 0}
.pub-foot{max-width:1080px;margin:50px auto 0;padding:26px 16px;border-top:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--ink-2);font-size:14px}
.pub-foot p{margin:0;flex:1;min-width:220px}
.pub-foot a{color:var(--ink)}
.pub-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;display:flex;gap:16px;align-items:center;background:var(--ink);color:#1b1b1b;border-radius:999px;padding:8px 8px 8px 22px;box-shadow:0 18px 40px rgba(0,0,0,.5);width:min(520px,calc(100% - 24px));justify-content:space-between}
.pub-wa{position:fixed;right:18px;bottom:18px;z-index:40;width:58px;height:58px;border-radius:50%;background:#1f8f55;color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.pub-cart{position:fixed;left:18px;bottom:18px;z-index:39;background:var(--panel-3);border:1px solid var(--line-2);color:var(--ink);border-radius:999px;padding:12px 18px;font-weight:800;display:flex;gap:8px;align-items:center;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.pub-cart.up{bottom:84px}
@media (max-width:860px){
  .pub-top nav{order:3;width:100%;overflow-x:auto;gap:18px;padding-bottom:2px;scrollbar-width:none}
  .pub-top nav::-webkit-scrollbar{display:none}
  .pub-hero{grid-template-columns:1fr;gap:18px;padding-top:24px}
  .pub-logo{max-width:220px}
  .pub-svc{grid-template-columns:1fr}
  .pub-club{grid-template-columns:1fr}
  .club-card{position:static;order:-1}
  .two-col{grid-template-columns:1fr}
}

/* ---------- Modal de reserva ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.m-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 6px}
.m-h h3{font-family:var(--display);font-weight:400;font-size:32px;margin:0;line-height:1}
.m-h small{display:block;color:var(--ink-3);font-size:13px}
.m-b{padding:10px 18px 16px;overflow:auto;flex:1}
.m-f{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel)}
.m-f .btn-main,.m-f .btn-wa{flex:1}
.bk-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 18px 0}
.bk-steps i{height:5px;border-radius:5px;background:var(--panel-3)}
.bk-steps i.on{background:var(--pole);background-size:40px 40px}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:12px 14px}
.opt.on{border-color:var(--chrome);background:var(--panel-3)}
.opt b{display:block}
.opt small{color:var(--ink-3);font-size:12.5px;display:block}
.opt .pr{font-family:var(--display);font-size:24px}
.bk-sum{background:var(--panel-2);border-radius:12px;padding:10px 14px;font-size:13.5px}
.bk-sum .l{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.ddays{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin-bottom:14px}
.dday{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:8px 4px;text-align:center}
.dday small{display:block;font-size:11px;color:var(--ink-3);text-transform:uppercase}
.dday b{font-family:var(--display);font-size:26px;font-weight:400;line-height:1}
.dday.on{background:var(--ink);color:#1b1b1b;border-color:var(--ink)}
.dday.on small{color:#555}
.dday[disabled]{opacity:.3;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.slot{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 0;font-weight:700}
.slot.on{background:var(--ink);color:#1b1b1b;border-color:var(--ink)}
.bk-ok{text-align:center;padding:6px 0 14px}
.bk-ok .tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:inline-grid;place-items:center;margin-bottom:10px}
.bk-ok h2{font-family:var(--display);font-weight:400;font-size:38px;margin:0;line-height:1.05}
.bk-ok p{color:var(--ink-2);margin:8px 0 0}
.bk-actions{display:grid;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#1b1b1b;padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
@media (max-width:560px){.modal{padding:0;align-items:flex-end}.mbox{border-radius:20px 20px 0 0;max-height:94vh}}
</style>

<body>

  $('#svcList').innerHTML = SERVICES.map(v=>{ const on=PUB.sel.includes(v.id);

}
function pubSel(id){ const i=PUB.sel.indexOf(id); i>=0?PUB.sel.splice(i,1):PUB.sel.push(id); renderServices(); renderFloats(); }

/* productos + carrito */
function renderProducts(){
  $('#prodChips').innerHTML = CATS.map(c=>`<button class="chip ${PUB.cat===c?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('');
  $('#prodList').innerHTML = PRODUCTS.filter(p=>PUB.cat==='Todos'||p.cat===PUB.cat).map(p=>{
    const q=cart[p.id]||0;
    return `<div class="pcard"><div class="pimg">${p.emoji}${p.tag?`<i>${p.tag}</i>`:''}</div><div class="pn">${p.name}</div><div class="pd">${p.desc}</div><div class="pp">${money(p.price)}</div>`+
    (q?`<div class="stepper"><button onclick="chg('${p.id}',-1)">−</button><span>${q}</span><button onclick="chg('${p.id}',1)">+</button></div>`:`<button class="btn btn-line btn-sm btn-block" onclick="chg('${p.id}',1)">Agregar</button>`)+`</div>`;
  }).join('');
}
function setCat(c){ PUB.cat=c; renderProducts(); }
function chg(id,d){
  cart[id]=Math.max(0,(cart[id]||0)+d); if(!cart[id]) delete cart[id];
  renderProducts(); renderFloats(); if($('#modal').classList.contains('on') && CART_OPEN) renderCartModal();
}
const cartItems = () => Object.entries(cart).map(([id,q])=>({...PRODUCTS.find(p=>p.id===id),q}));

const cartCount = () => cartItems().reduce((a,i)=>a+i.q,0);

}

  const it=cartItems();
  if(!it.length){ CART_OPEN=false; closeModal(); return; }
  openModal(`<div class="m-h"><div><h3>Tu pedido</h3><small>Productos para retirar en el local</small></div><button class="btn btn-ghost" onclick="CART_OPEN=false;closeModal()" aria-label="Cerrar">${ic('x',18)}</button></div>
  <div class="m-b">${it.map(i=>`<div class="opt" style="cursor:default;margin-bottom:8px"><div><b>${i.name}</b><small>${money(i.price*i.q)}</small></div><div class="stepper" style="gap:8px"><button onclick="chg('${i.id}',-1)">−</button><span>${i.q}</span><button onclick="chg('${i.id}',1)">+</button></div></div>`).join('')}
    <div class="bk-sum mt"><div class="l"><b>Total</b><b>${money(cartTotal())}</b></div></div>
    <div class="mt"><input class="input" id="cName" placeholder="Tu nombre" autocomplete="name" value="${esc(cartFields.n)}" oninput="cartFields.n=this.value"></div>
    <div class="mt"><textarea class="input" id="cNote" rows="2" placeholder="Aclaraciones (retiro, horario, etc.)" oninput="cartFields.note=this.value">${esc(cartFields.note)}</textarea></div></div>
  <div class="m-f"><button class="btn btn-wa" onclick="sendOrder()">${ic('chat',16)} Enviar pedido por WhatsApp</button></div>`);
}
function sendOrder(){
  const it=cartItems(); if(!it.length) return;
  let t=`Hola ${BIZ.name} 💈! Quiero hacer un pedido:\n\n`+it.map(i=>`• ${i.q} x ${i.name} — ${money(i.price*i.q)}`).join('\n')+`\n\n💰 Total: ${money(cartTotal())}`;
  if(cartFields.n.trim()) t+=`\n👤 Nombre: ${cartFields.n.trim()}`;
  if(cartFields.note.trim()) t+=`\n📝 ${cartFields.note.trim()}`;
  window.open(wa(t),'_blank');
}

/* ============ TURNERO (4 pasos, como el menú público RAVE) ============ */
const days = (()=>{ const out=[]; const d=new Date(); d.setHours(0,0,0,0); while(out.length<7){ if(d.getDay()!==0) out.push(new Date(d)); d.setDate(d.getDate()+1);} return out; })();
let BK=null;
let TAKEN = store('bj_taken') || [];
function bookStart(o={}){
  BK = {step:1, sel:[...(o.sel||[])], barber:o.barber||'any', day:null, min:null, who:null, n:'', p:'', note:'', prod:true, pay:'sena', done:false};
  if(BK.sel.length) BK.step=2;
  renderBook();
}
const deposit = () => { const p=sumP(BK.sel); if(!p) return 0; return Math.min(p, Math.max(DEPOSIT.min, Math.round(p*DEPOSIT.pct/100/500)*500)); };
function daySlots(){ const out=[]; SHIFTS.forEach(([a,b],si)=>{ for(let m=a*60;m<b*60;m+=STEP) out.push({m,si}); }); return out; }
function barberFree(date,barber,slots,i,blocks){
  for(let k=0;k<blocks;k++){
    const s=slots[i+k]; if(!s||s.si!==slots[i].si) return false;
    if(TAKEN.includes(date+'|'+barber+'|'+s.m)) return false;
    if(hash(date+barber+s.m)%100<32) return false;       // turnos ya tomados (simulado)
  }
  return true;
}
function slotsFor(d){
  const slots=daySlots(), blocks=Math.max(1,Math.ceil(sumM(BK.sel)/STEP)), now=new Date(), date=ymd(d), isToday=date===ymd(now), nowM=now.getHours()*60+now.getMinutes()+30;
  const list = BK.barber==='any'?BARBERS.map(b=>b.id):[BK.barber], out=[];
  slots.forEach((s,i)=>{ if(isToday&&s.m<nowM) return; const f=list.find(b=>barberFree(date,b,slots,i,blocks)); if(f) out.push({m:s.m,who:f}); });
  return out;
}
function bkSummary(){
  const dur=sumM(BK.sel), tot=sumP(BK.sel);
  return `<div class="bk-sum">${BK.sel.map(id=>`<div class="l"><span>${V(id).name}</span><span>${money(V(id).price)}</span></div>`).join('')}
    <div class="l" style="border-top:1px solid var(--line);padding-top:6px;margin-top:4px"><span class="muted">${dur} min${BK.barber!=='any'?' · '+BK.barber:''}</span><b>${money(tot)}</b></div></div>`;
}
function renderBook(){
  const st=BK.step;
  const titles={1:['Elegí tus servicios','Paso 1 de 4'],2:['Elegí tu barbero','Paso 2 de 4'],3:['Día y horario','Paso 3 de 4'],4:['Tus datos y la seña','Paso 4 de 4']};
  if(BK.done) return renderBookDone();
  let body='', foot='';
  if(st===1){
    body=`<div class="opts">${SERVICES.map(v=>`<button class="opt ${BK.sel.includes(v.id)?'on':''}" onclick="bkSvc('${v.id}')"><div><b>${v.name}</b><small>${v.min} min${v.note?' · '+v.note:''}</small></div><span class="pr">${money(v.price)}</span></button>`).join('')}</div>${BK.sel.length?`<div class="mt">${bkSummary()}</div>`:''}`;
    foot=`<button class="btn btn-main" ${BK.sel.length?'':'disabled'} onclick="bkGo(2)">Elegir barbero</button>`;
  } else if(st===2){
    body=`<div class="mt" style="margin:0 0 12px">${bkSummary()}</div><div class="opts">
      <button class="opt ${BK.barber==='any'?'on':''}" onclick="bkBar('any')"><div><b>El primero libre</b><small>Te asignamos el barbero disponible</small></div>${BK.barber==='any'?ic('check',18):''}</button>
      ${BARBERS.map(b=>`<button class="opt ${BK.barber===b.id?'on':''}" onclick="bkBar('${b.id}')"><div style="display:flex;gap:12px;align-items:center"><div class="av" style="background:${b.color};width:38px;height:38px;font-size:22px">${b.id[0]}</div><div><b>${b.id}</b><small>“${b.nick}” · ${b.spec}</small></div></div>${BK.barber===b.id?ic('check',18):''}</button>`).join('')}</div>`;
    foot=`<button class="btn btn-ghost" onclick="bkGo(1)">Atrás</button><button class="btn btn-main" onclick="bkGo(3)">Elegir día y horario</button>`;
  } else if(st===3){
    if(BK.day==null || !slotsFor(days.find(d=>ymd(d)===BK.day)).length){ const f=days.find(d=>slotsFor(d).length); BK.day=f?ymd(f):null; }
    const dObj=BK.day&&days.find(d=>ymd(d)===BK.day), slots=dObj?slotsFor(dObj):[];
    body=`<div class="ddays">${days.map(d=>{ const has=slotsFor(d).length>0; return `<button class="dday ${BK.day===ymd(d)?'on':''}" ${has?'':'disabled'} onclick="BK.day='${ymd(d)}';BK.min=null;BK.who=null;renderBook()"><small>${ymd(d)===ymd(new Date())?'Hoy':dayWk(d)}</small><b>${d.getDate()}</b></button>`; }).join('')}</div>
      ${slots.length?`<div class="slots">${slots.map(s=>`<button class="slot ${BK.min===s.m?'on':''}" onclick="BK.min=${s.m};BK.who='${s.who}';renderBook()">${hm(s.m)}</button>`).join('')}</div>`:'<p class="muted">No hay horarios libres para esta combinación. Probá con otro barbero o menos servicios.</p>'}`;
    foot=`<button class="btn btn-ghost" onclick="bkGo(2)">Atrás</button><button class="btn btn-main" ${BK.min!=null?'':'disabled'} onclick="bkGo(4)">Completar mis datos</button>`;
  } else {
    const dObj=days.find(d=>ymd(d)===BK.day), dep=deposit(), tot=sumP(BK.sel), ok=BK.n.trim().length>=3 && BK.p.replace(/\D/g,'').length>=8;
    body=`<div class="bk-sum" style="margin-bottom:12px"><div class="l"><span>📅 ${dayLong(dObj)} · ${hm(BK.min)} h</span><span class="muted">con ${BK.who}</span></div>${BK.sel.map(id=>`<div class="l"><span>${V(id).name}</span><span>${money(V(id).price)}</span></div>`).join('')}<div class="l" style="border-top:1px solid var(--line);padding-top:6px;margin-top:4px"><span class="muted">${sumM(BK.sel)} min</span><b>${money(tot)}</b></div></div>
      <div class="row2"><input class="input" id="bN" placeholder="Nombre y apellido" autocomplete="name" value="${esc(BK.n)}" oninput="BK.n=this.value;bkEnable()"><input class="input" id="bP" inputmode="tel" placeholder="WhatsApp" autocomplete="tel" value="${esc(BK.p)}" oninput="BK.p=this.value;bkEnable()"></div>
      <div class="mt"><input class="input" id="bNote" placeholder="Aclaraciones (opcional)" value="${esc(BK.note)}" oninput="BK.note=this.value"></div>
      ${cartCount()?`<label class="check mt"><input type="checkbox" ${BK.prod?'checked':''} onchange="BK.prod=this.checked"><span>Sumar los productos de mi pedido (${money(cartTotal())}) para retirar en el turno</span></label>`:''}
      <label class="fl mt" style="margin-top:16px">Seña para reservar</label>
      <div class="opts"><button class="opt ${BK.pay==='sena'?'on':''}" onclick="BK.pay='sena';renderBook()"><div><b>💳 Seña por transferencia</b><small>${DEPOSIT.pct}% (${money(dep)}) asegura tu horario · el resto en el local</small></div>${BK.pay==='sena'?ic('check',18):''}</button>
      <button class="opt ${BK.pay==='local'?'on':''}" onclick="BK.pay='local';renderBook()"><div><b>💵 Pago todo en el local</b><small>El turno queda sujeto a confirmación</small></div>${BK.pay==='local'?ic('check',18):''}</button></div>
      ${BK.pay==='sena'?transferBox(dep,'Seña turno '+BIZ.name):''}`;
    foot=`<button class="btn btn-ghost" onclick="bkGo(3)">Atrás</button><button class="btn btn-wa" id="bkConfirm" ${ok?'':'disabled'} onclick="bkConfirm()">${ic('chat',16)} ${BK.pay==='sena'?'Reservar y enviar comprobante':'Confirmar turno por WhatsApp'}</button>`;
  }
  openModal(`<div class="m-h"><div><h3>${titles[st][0]}</h3><small>${titles[st][1]}</small></div><button class="btn btn-ghost" onclick="closeModal()" aria-label="Cerrar">${ic('x',18)}</button></div>
    <div class="bk-steps">${[1,2,3,4].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div><div class="m-b">${body}</div><div class="m-f">${foot}</div>`);
}
function bkEnable(){ const b=$('#bkConfirm'); if(b) b.disabled=!(BK.n.trim().length>=3 && BK.p.replace(/\D/g,'').length>=8); }
function bkSvc(id){ const i=BK.sel.indexOf(id); i>=0?BK.sel.splice(i,1):BK.sel.push(id); BK.day=null; BK.min=null; renderBook(); }
function bkBar(b){ BK.barber=b; BK.day=null; BK.min=null; renderBook(); }
function bkGo(s){ BK.step=s; renderBook(); const mb=$('.m-b'); if(mb) mb.scrollTop=0; }
function bkMessage(){
  const dObj=days.find(d=>ymd(d)===BK.day), tot=sumP(BK.sel), dep=deposit();
  let t=`Hola ${BIZ.name} 💈! Quiero reservar un turno:\n\n`+BK.sel.map(id=>`✂️ ${V(id).name} — ${money(V(id).price)}`).join('\n');
  t+=`\n\n💈 Barbero: ${BK.who}\n📅 Día: ${dayLong(dObj)}\n🕒 Hora: ${hm(BK.min)} hs\n⏱ Duración aprox: ${sumM(BK.sel)} min\n💰 Total: ${money(tot)}`;
  t+= BK.pay==='sena' ? `\n\n💳 Seña por transferencia: ${money(dep)}\nAlias: ${BANK.alias}\nResto en el local: ${money(tot-dep)}\n📎 Te mando el comprobante en este chat.` : `\n\n💵 Pago en el local (turno a confirmar).`;
  if(BK.prod && cartItems().length) t+=`\n\n🛍 Productos para retirar:\n`+cartItems().map(i=>`• ${i.q} x ${i.name}`).join('\n')+`\nSubtotal productos: ${money(cartTotal())}`;
  t+=`\n\n👤 Nombre: ${BK.n.trim()}\n📱 Teléfono: ${BK.p.trim()}`;
  if(BK.note.trim()) t+=`\n📝 ${BK.note.trim()}`;
  return t;
}
function gcalUrl(){
  const d=days.find(x=>ymd(x)===BK.day), s=new Date(d); s.setHours(0,BK.min,0,0); const e=new Date(s.getTime()+sumM(BK.sel)*60000);
  const f=x=>x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Turno en '+BIZ.name+' 💈')+'&dates='+f(s)+'/'+f(e)+'&ctz=America/Argentina/Salta&location='+encodeURIComponent(ADDRESS)+'&details='+encodeURIComponent(BK.sel.map(id=>V(id).name).join(', ')+' con '+BK.who);
}
function bkConfirm(){
  window.open(wa(bkMessage()),'_blank');
  const blocks=Math.max(1,Math.ceil(sumM(BK.sel)/STEP)); for(let k=0;k<blocks;k++) TAKEN.push(BK.day+'|'+BK.who+'|'+(BK.min+k*STEP)); store('bj_taken',TAKEN);
  BK.done=true; renderBookDone();
}
function renderBookDone(){
  const dObj=days.find(d=>ymd(d)===BK.day);
  openModal(`<div class="m-b"><div class="bk-ok"><div class="tick">${ic('check',34)}</div><h2>¡Turno solicitado!</h2>
    <p>${esc(BK.n.trim().split(' ')[0])}, te esperamos el <b>${dayLong(dObj)}</b> a las <b>${hm(BK.min)} h</b> con ${BK.who}.</p>
    <p>${BK.pay==='sena'?'Acordate de enviar el comprobante de la seña por WhatsApp para confirmar tu horario.':'La barbería te confirma el turno por WhatsApp.'}</p></div>
    <div class="bk-actions"><a class="btn btn-wa btn-block" href="${wa(bkMessage())}" target="_blank" rel="noopener">${ic('chat',16)} Abrir WhatsApp de nuevo</a><a class="btn btn-line btn-block" href="${gcalUrl()}" target="_blank" rel="noopener">${ic('cal',16)} Agregar a Google Calendar</a><button class="btn btn-ghost btn-block" onclick="closeModal()">Cerrar</button></div></div>`);
}

/* ============ CLUB DE SOCIOS + TARJETA ============ */
const M = { plan:'m2' };
let mcQR=null;
const curPlan = () => PLANS.find(p=>p.id===M.plan);
function renderClubPlans(){
  $('#plans').innerHTML = PLANS.map(p=>`<button class="plan ${M.plan===p.id?'on':''}" onclick="setPlan('${p.id}')"><div class="ph"><span class="pn2">${p.name}</span><span class="pr">${money(p.price)}<small> /mes</small></span></div><ul>${p.perks.map(x=>`<li>${x}</li>`).join('')}</ul></button>`).join('');
}
function setPlan(id){ M.plan=id; renderClubPlans(); updateCard(); }
function memberNo(){
  const n=($('#mName')||{}).value||'', p=($('#mPhone')||{}).value||'';
  if(n.trim().length<3 || p.replace(/\D/g,'').length<6) return 'BJ-0000';
  return 'BJ-'+String(hash(n.trim().toLowerCase()+p.replace(/\D/g,''))%9000+1000);
}
function updateCard(){
  if(!$('#mcard')) return;
  const pl=curPlan(), name=$('#mName').value.trim(), phone=$('#mPhone').value.replace(/\D/g,''), no=memberNo(), d=new Date();
  $('#mcard').dataset.plan=M.plan;
  $('#mcPlan').textContent=pl.name.toUpperCase();
  $('#mcName').textContent=name?name:'TU NOMBRE';
  $('#mcNo').textContent=no;
  $('#mcSince').textContent=pad(d.getMonth()+1)+'/'+d.getFullYear();
  if(!mcQR && typeof QRCode!=='undefined'){ try{ mcQR=new QRCode($('#mcQr'),{text:no,width:54,height:54}); }catch(e){} }
  else if(mcQR){ try{ mcQR.makeCode(no+'|'+(name||'socio')); }catch(e){} }
  $('#clubPay').innerHTML = transferBox(pl.price,'Cuota '+pl.name+(name?' - '+name:''));
  $('#clubSend').disabled = !(name.length>=3 && phone.length>=8 && $('#mOk').checked);
}
function sendClub(){
  const pl=curPlan(), v=id=>$('#'+id).value.trim();
  let t=`Hola ${BIZ.name} 💈! Quiero asociarme al Club:\n\n⭐ Plan: ${pl.name} — ${money(pl.price)}/mes\n🔖 N° de socio: ${memberNo()}\n👤 Nombre: ${v('mName')}`;
  if(v('mDni')) t+=`\n🪪 DNI: ${v('mDni')}`;
  t+=`\n📱 Teléfono: ${v('mPhone')}`;
  if(v('mMail')) t+=`\n📧 Email: ${v('mMail')}`;
  if(v('mBirth')) t+=`\n🎂 Nacimiento: ${v('mBirth')}`;
  t+=`\n💈 Barbero favorito: ${$('#mBarber').value}\n\n💳 Primera cuota por transferencia: ${money(pl.price)}\nAlias: ${BANK.alias}\n📎 Te mando el comprobante en este chat.`;
  window.open(wa(t),'_blank');
}

/* ============ SELLOS ============ */
let stamps = store('bj_stamps') || 0;
function renderStamps(){
  const g=BIZ.stampsGoal, full=stamps>=g;
  $('#stampBox').innerHTML = `<div class="stamp"><div class="stamp-h"><b>Tarjeta de sellos</b><small>Barbería Juan · Salta Capital</small></div>
    <div class="stamp-g">${Array.from({length:g},(_,i)=>`<div class="st ${i<stamps?'on':''}">${i<stamps?'✂':(i===g-1?'🎁':i+1)}</div>`).join('')}</div>
    <p class="stamp-f"><span class="cnt">${Math.min(stamps,g)}/${g}</span> sellos · ${full?'¡Premio listo! '+BIZ.reward:'Faltan '+(g-stamps)+' para '+BIZ.reward.toLowerCase()}</p>
    <div style="display:grid;gap:8px;margin-top:12px">${full
      ? `<button class="btn btn-wa btn-block" onclick="claim()">${ic('chat',16)} Canjear mi premio por WhatsApp</button>`
      : `<button class="btn btn-main btn-block" style="background:#1b1b1b;color:#fff" onclick="addStamp()">📲 Simular escaneo del QR en el local</button>`}
      <button class="btn btn-block" style="border-color:#c9c3ba;color:#4a4640" onclick="resetStamps()">Reiniciar demo</button></div></div>`;
}
function addStamp(){ stamps=Math.min(stamps+1,BIZ.stampsGoal); store('bj_stamps',stamps); renderStamps(); toast('¡Sello sumado! 💈'); }
function resetStamps(){ stamps=0; store('bj_stamps',0); renderStamps(); }
function claim(){ window.open(wa(`Hola ${BIZ.name} 💈! Completé mi tarjeta de ${BIZ.stampsGoal} sellos y quiero canjear: ${BIZ.reward}.`),'_blank'); }

/* ============ QR para compartir ============ */
function drawQR(){ const el=$('#qr'); if(!el||typeof QRCode==='undefined') return; try{ new QRCode(el,{text:location.href.split('#')[0],width:140,height:140}); }catch(e){} }

/* ============ INIT ============ */
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ CART_OPEN=false; closeModal(); } });
renderPub();
setInterval(()=>{ const p=document.querySelector('.pub-open'); if(p) p.lastChild.textContent = isOpen()?'Abierto ahora · hasta las 21 h':'Cerrado ahora · abrimos de lunes a sábado a las 9 h'; },60000);
</script>
</body>
